<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Galastis</title>
<link rel="icon" type="image/x-icon" href="logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="logo.ico" alt="Logo Galastis" class="brand-logo">
    <div class="brand-text">
      <h1>Admin Galastis</h1>
      <p>Kelola kategori, seri, dan link karya</p>
    </div>
  </div>
  <div class="header-actions">
    <a href="index.html">Lihat Galeri</a>
    <button id="btn-logout">Logout</button>
  </div>
</header>

<div id="login-view" class="login-wrap" style="display:none;">
  <div class="login-box">
    <h2>Masuk Admin</h2>
    <p style="color:var(--abu); font-size:13.5px;">Halaman ini khusus admin. Silakan login.</p>
    <a href="login.html" class="btn btn-primary" style="width:100%; display:block; box-sizing:border-box; text-decoration:none;">Ke Halaman Login</a>
  </div>
</div>

<div id="admin-view" class="admin-wrap-wide" style="display:none;">

  <!-- KOLOM KIRI: Kelola Karya -->
  <div class="admin-col">
    <div class="panel" style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0;">
        <h3 style="margin:0;">Daftar Karya Tersimpan</h3>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          <button class="btn btn-primary" id="btn-open-add" style="font-size:12.5px; padding:8px 14px;">+ Tambah Karya</button>
          <button class="btn btn-secondary" id="btn-sync" title="Sync dari Pengumpulan (sheet O1–O4)">⟳ Sync</button>
        </div>
      </div>
      <p class="status-msg" id="sync-msg"></p>
      <div id="konten-table" style="flex:1; overflow-y:auto;">Memuat...</div>
    </div>
  </div>

  <!-- MODAL: Tambah / Edit Karya -->
  <div class="modal-overlay" id="karya-modal-overlay">
    <div class="modal-box" style="width:min(520px, 100%);">
      <div class="modal-header">
        <h3 id="form-title">Tambah Karya Baru</h3>
        <button class="modal-close" id="karya-modal-close">&times;</button>
      </div>
      <div style="padding:18px 22px;">
        <div class="form-grid full">
          <div>
            <label>Kategori</label>
            <select id="f-kategori">
              <option>Infografis</option>
              <option>Videografis</option>
              <option>Flyer</option>
              <option>Join Riset</option>
            </select>
          </div>
        </div>
        <div class="form-grid">
          <div>
            <label>Seri</label>
            <input id="f-seri" placeholder='Contoh: 1, 2, atau "Ekonomi"'>
          </div>
          <div>
            <label>Nama Mahasiswa</label>
            <input id="f-mahasiswa" placeholder="Nama, atau nomor kelompok">
          </div>
        </div>
        <div class="form-grid full">
          <div>
            <label>Link Google Drive</label>
            <input id="f-embed" placeholder="https://drive.google.com/file/d/....">
          </div>
        </div>
        <div class="form-grid full">
          <div>
            <label>Link Thumbnail <span style="font-weight:400;color:var(--abu)">(opsional)</span></label>
            <input id="f-thumb" placeholder="Kosongkan untuk ambil otomatis dari Drive">
          </div>
        </div>
        <div class="row-actions">
          <button class="btn btn-primary" id="btn-add">Tambah Karya</button>
          <button class="btn btn-outline" id="btn-cancel-edit">Batal</button>
          <p class="status-msg" id="add-msg"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- KOLOM KANAN: Kelola Pegawai -->
  <div class="admin-col">
    <div class="panel" style="flex-shrink:0;">
      <h3>Tambah Pegawai</h3>
      <p style="color:var(--abu); font-size:13px; margin-top:-8px; margin-bottom:12px;">Pegawai yang terdaftar bisa login untuk like &amp; berkomentar.</p>
      <div class="form-grid">
        <div>
          <label>Nama Pegawai</label>
          <input id="f-pegawai" placeholder="Nama lengkap pegawai">
        </div>
        <div>
          <label>NIP</label>
          <input id="f-nip" placeholder="NIP pegawai">
        </div>
      </div>
      <div class="row-actions">
        <button class="btn btn-secondary" id="btn-add-pegawai">Tambah Pegawai</button>
        <p class="status-msg" id="pegawai-msg"></p>
      </div>
    </div>

    <div class="panel" style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <h3 style="flex-shrink:0;">Daftar Pegawai</h3>
      <div id="pegawai-table" style="flex:1; overflow-y:auto;">Memuat...</div>
    </div>
  </div>

</div>

<script src="assets/app-admin.js"></script>
</body>
</html>
