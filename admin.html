<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Galastis</title>
<link rel="icon" type="image/x-icon" href="logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .admin-wrap { max-width: 760px; margin: 0 auto; padding: 34px 20px 70px; }
  .login-box {
    max-width: 380px; margin: 90px auto; background: #fff; border: 1px solid var(--garis);
    border-radius: var(--radius); padding: 30px; text-align: center;
  }
  .login-box h2 { font-family: var(--font-display); margin-top: 0; }
  .login-box input {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--garis);
    margin: 14px 0; font-size: 14px; font-family: var(--font-body);
  }
  .panel { background: #fff; border: 1px solid var(--garis); border-radius: var(--radius); padding: 22px; margin-bottom: 22px; }
  .panel h3 { font-family: var(--font-display); margin-top: 0; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-grid.full { grid-template-columns: 1fr; }
  label { font-size: 12.5px; font-weight: 600; color: var(--abu); display: block; margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--garis);
    font-family: var(--font-body); font-size: 13.5px; background: var(--kertas);
  }
  textarea { resize: vertical; min-height: 60px; }
  .row-actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .status-msg { font-size: 13px; margin-top: 8px; }
  .status-msg.ok { color: var(--hijau); }
  .status-msg.err { color: #C0392B; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--garis); }
  th { color: var(--abu); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .del-btn { border: none; background: var(--oren-muda); color: var(--oren); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="logo.ico" alt="Logo Galastis" class="brand-logo">
    <div class="brand-text">
      <h1>Admin Galastis</h1>
      <p>Kelola kategori, seri, dan link karya</p>
    </div>
  </div>
  <div class="header-actions">
    <a href="index.html">Lihat Galeri</a>
  </div>
</header>

<div id="login-view" class="login-box">
  <h2>Masuk Admin</h2>
  <p style="color:var(--abu); font-size:13.5px;">Masukkan password admin untuk mengelola konten.</p>
  <input type="password" id="admin-password" placeholder="Password admin">
  <button class="btn btn-primary" style="width:100%" id="btn-login">Masuk</button>
  <p class="status-msg err" id="login-msg"></p>
</div>

<div id="admin-view" class="admin-wrap" style="display:none;">

  <div class="panel">
    <h3>Tambah Karya Baru</h3>
    <div class="form-grid">
      <div>
        <label>Kategori</label>
        <select id="f-kategori">
          <option>Infografis</option>
          <option>Videografis</option>
          <option>Flyer</option>
          <option>Mini Paper</option>
        </select>
      </div>
      <div>
        <label>Seri (bebas, boleh angka/nama)</label>
        <input id="f-seri" placeholder="Contoh: 1, 2, atau &quot;Ekonomi&quot;">
      </div>
    </div>
    <div class="form-grid">
      <div>
        <label>Nama Mahasiswa</label>
        <input id="f-mahasiswa" placeholder="Nama mahasiswa magang">
      </div>
      <div>
        <label>Link Google Drive (share link file/folder)</label>
        <input id="f-embed" placeholder="https://drive.google.com/file/d/....">
      </div>
    </div>
    <div class="form-grid">
      <div>
        <label>Link Thumbnail (opsional, gambar sampul)</label>
        <input id="f-thumb" placeholder="https://... (opsional)">
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary" id="btn-add">Tambah Karya</button>
      <p class="status-msg" id="add-msg"></p>
    </div>
  </div>

  <div class="panel">
    <h3>Tambah Nama Pegawai (untuk pilihan voting)</h3>
    <div class="form-grid">
      <div><input id="f-pegawai" placeholder="Nama pegawai"></div>
      <div><button class="btn btn-secondary" id="btn-add-pegawai">Tambah Pegawai</button></div>
    </div>
    <p class="status-msg" id="pegawai-msg"></p>
  </div>

  <div class="panel">
    <h3>Daftar Karya Tersimpan</h3>
    <div id="konten-table">Memuat...</div>
  </div>

</div>

<script src="assets/app-admin.js"></script>
</body>
</html>
