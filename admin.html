<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Galastis</title>
<link rel="icon" type="image/x-icon" href="logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="logo.ico" alt="Logo Galastis" class="brand-logo">
    <div class="brand-text">
      <h1>Admin Galastis</h1>
      <p>Kelola kategori, seri, dan link karya</p>
    </div>
  </div>
  <div class="header-actions">
    <a href="index.html">Lihat Galeri</a>
    <button id="btn-logout">Logout</button>
  </div>
</header>

<div id="login-view" class="login-wrap" style="display:none;">
  <div class="login-box">
    <h2>Masuk Admin</h2>
    <p style="color:var(--abu); font-size:13.5px;">Halaman ini khusus admin. Silakan login.</p>
    <a href="login.html" class="btn btn-primary" style="width:100%; display:block; box-sizing:border-box; text-decoration:none;">Ke Halaman Login</a>
  </div>
</div>

<div id="admin-view" class="admin-wrap" style="display:none;">

  <div class="panel">
    <h3>Tambah Karya Baru</h3>
    <div class="form-grid">
      <div>
        <label>Kategori</label>
        <select id="f-kategori">
          <option>Infografis</option>
          <option>Videografis</option>
          <option>Flyer</option>
          <option>Join Riset</option>
        </select>
      </div>
      <div>
        <label>Seri (bebas, boleh angka/nama)</label>
        <input id="f-seri" placeholder="Contoh: 1, 2, atau &quot;Ekonomi&quot;">
      </div>
    </div>
    <div class="form-grid">
      <div>
        <label>Nama Mahasiswa</label>
        <input id="f-mahasiswa" placeholder="Nama mahasiswa (jika kelompok, pisahkan dengan koma)">
      </div>
      <div>
        <label>Link Google Drive (share link file/folder)</label>
        <input id="f-embed" placeholder="https://drive.google.com/file/d/....">
      </div>
    </div>
    <div class="form-grid">
      <div>
        <label>Link Thumbnail (opsional — kosongkan untuk ambil otomatis dari Drive)</label>
        <input id="f-thumb" placeholder="https://... (opsional)">
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary" id="btn-add">Tambah Karya</button>
      <p class="status-msg" id="add-msg"></p>
    </div>
  </div>

  <div class="panel">
    <h3>Tambah Pegawai (untuk login &amp; like/komentar)</h3>
    <div class="form-grid">
      <div>
        <label>Nama Pegawai</label>
        <input id="f-pegawai" placeholder="Nama pegawai">
      </div>
      <div>
        <label>NIP</label>
        <input id="f-nip" placeholder="NIP pegawai">
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn-secondary" id="btn-add-pegawai">Tambah Pegawai</button>
      <p class="status-msg" id="pegawai-msg"></p>
    </div>
    <div id="pegawai-table" style="margin-top:14px;"></div>
  </div>

  <div class="panel">
    <h3>Daftar Karya Tersimpan</h3>
    <div id="konten-table">Memuat...</div>
  </div>

</div>

<script src="assets/app-admin.js"></script>
</body>
</html>
