<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galastis — Galeri Karya Magang Eksplorasi Data Statistik</title>
<link rel="icon" type="image/x-icon" href="logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="dns-prefetch" href="https://drive.google.com">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="logo.ico" alt="Logo Galastis" class="brand-logo">
    <div class="brand-text">
      <h1>Galastis</h1>
      <p>Galeri Karya Magang Eksplorasi Data Statistik — BPS Provinsi Kepulauan Bangka Belitung</p>
    </div>
  </div>
  <div class="header-actions" id="header-actions">
    <a href="#" id="login-link">Login</a>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<div class="modal-overlay" id="modal-overlay"></div>

<div class="modal-overlay" id="login-overlay">
  <div class="login-box" style="max-width:400px; width:100%;">
    <button class="modal-close" id="login-modal-close" style="float:right;">&times;</button>
    <h2>Login</h2>
    <p style="color:var(--abu); font-size:13.5px; margin-top:-6px; margin-bottom:16px;">Masukkan NIP Anda untuk like &amp; berkomentar.</p>

    <div id="login-input-wrap">
      <label style="text-align:left; display:block; font-size:12px; font-weight:600; color:var(--abu); margin-bottom:4px;">NIP 9 Digit</label>
      <input type="password" id="login-input" placeholder="Masukkan NIP 9 digit">
      <button class="btn btn-primary" style="width:100%; margin-top:12px;" id="btn-login-unified">Masuk</button>
    </div>

    <p class="status-msg" id="login-msg"></p>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
